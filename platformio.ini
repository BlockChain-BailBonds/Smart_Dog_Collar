[env:esp32-s3-devkitc-1]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D ENABLE_BLE=0

; Enable event-only BLE explicitly with -D ENABLE_BLE=1 (remove the 0 flag).
; This environment targets a DevKitC-1 reference board, not a bare S3-MINI module.
